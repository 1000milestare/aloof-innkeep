name = "aloof-innkeep-mail"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# No personal values are stored here. Set these as secrets (scripts/setup-cloudflare.sh does it):
#   OWNER_SENDERS, FORWARD_TO, GITHUB_TOKEN
# The KV id is substituted at deploy time from CF_KV_NAMESPACE_ID (see .github/workflows/worker.yml).
[[kv_namespaces]]
binding = "MAIL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
AIRBNB_SENDER = "automated@airbnb.com"
GITHUB_REPO = "1000milestare/aloof-innkeep"
GITHUB_WORKFLOW = "run.yml"
GITHUB_REF = "main"
