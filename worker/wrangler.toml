name = "aloof-innkeep-mail"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Secrets are not stored here:
#   wrangler secret put GITHUB_TOKEN
[[kv_namespaces]]
binding = "MAIL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
OWNER_SENDER = "gchirgwin@gmail.com"
OWNER_DKIM_DOMAIN = "gmail.com"
AIRBNB_SENDER = "automated@airbnb.com"
AIRBNB_DKIM_DOMAIN = "airbnb.com"
GITHUB_REPO = "1000milestare/aloof-innkeep"
GITHUB_WORKFLOW = "run.yml"
GITHUB_REF = "main"
