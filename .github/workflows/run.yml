name: Scheduled Sync

on:
  schedule:
    # Every 3 hours (8 runs/day), on the hour, UTC
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allow manual trigger

# Never run two syncs at once: they would race on the same events and codes.
concurrency:
  group: scheduled-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Run Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Use the binary built from main by release.yml. If there is no release yet, or
      # the download fails, the steps below build it here instead.
      - name: Download release binary
        id: download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin
          gh release download latest --repo "$GITHUB_REPOSITORY" \
            --pattern aloof-innkeep --dir bin --clobber
          chmod +x bin/aloof-innkeep

      - name: Fall back to building
        if: steps.download.outcome == 'failure'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.download.outcome == 'failure'
        uses: Swatinem/rust-cache@v2

      - name: Build release
        if: steps.download.outcome == 'failure'
        run: |
          cargo build --release
          mkdir -p bin
          cp target/release/aloof-innkeep bin/

      - name: Run full sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          AIRBNB_ICS_URL: ${{ secrets.AIRBNB_ICS_URL }}
          SEAM_API_KEY: ${{ secrets.SEAM_API_KEY }}
          SEAM_DEVICE_ID: ${{ secrets.SEAM_DEVICE_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          COMMAND_SENDER: ${{ secrets.COMMAND_SENDER }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLEANING_BUFFER_HOURS: ${{ secrets.CLEANING_BUFFER_HOURS || '3' }}
          LOG_LEVEL: info
        run: ./bin/aloof-innkeep
