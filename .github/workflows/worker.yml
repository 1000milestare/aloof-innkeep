name: Deploy mail Worker

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - name: Write deploy config (KV id comes from an org secret, not git)
        run: sed "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_ID}/" wrangler.toml > wrangler.deploy.toml
        working-directory: worker
        env:
          KV_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.deploy.toml
